services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jesegurity
      MYSQL_USER: jesegurity
      MYSQL_PASSWORD: jesegurity
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/jesegurity_mysql.sql:/docker-entrypoint-initdb.d/01-jesegurity.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "jesegurity", "-pjesegurity"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_DATABASE: jesegurity
      DB_USERNAME: jesegurity
      DB_PASSWORD: jesegurity
      APP_KEY: ${APP_KEY:-local-only-change-this-signing-key}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: