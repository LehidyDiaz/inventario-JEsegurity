services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jesegurity
      MYSQL_USER: jesegurity
      MYSQL_PASSWORD: jesegurity
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "jesegurity", "-pjesegurity"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_CONNECTION: mysql
      DB_PORT: 3306
      DB_DATABASE: jesegurity
      DB_USERNAME: jesegurity
      DB_PASSWORD: jesegurity
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:K7zJJOuPj4OnHDOAFnRPETX3BS0lKj1m4b3V7f8e9A0=}
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  app_storage:
